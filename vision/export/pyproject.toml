[project]
name = "estaciona-ai-model-export"
version = "0.9.0"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "paddlepaddle==2.6.2", "paddle2onnx==1.0.8", "onnx==1.22.0",
  "numpy==1.26.4", "protobuf==6.33.5", "opencv-python-headless==4.10.0.84",
  "pyyaml==6.0.2", "scipy==1.14.1", "pycocotools==2.0.8", "tqdm==4.67.1",
  "typeguard==2.13.3", "visualdl==2.5.3", "terminaltables==3.1.10",
  "shapely==2.0.7", "setuptools==84.1.0",
]

[tool.uv]
# Paddle 2.6.2 caps protobuf at 3.20.2 on Windows, and Paddle2ONNX 1.0.8 has
# no aarch64 wheel, so the export environment resolves for Linux x86_64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
