[project]
name = "estaciona-ai-vision"
version = "0.1.0"
license = "Apache-2.0"
description = "Computer vision module for Estaciona AI"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.6",
    "onnxruntime-gpu==1.31.0",
    "websockets>=16.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.31.0"]
# NVIDIA TensorRT runtime (proprietary NVIDIA license), loaded only by
# detector profiles that select provider "tensorrt".
tensorrt = ["onnxruntime-gpu[cuda,cudnn]==1.31.0", "tensorrt-cu13-libs==10.16.1.11"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["E402", "E741"]

# PyPI only hosts a download stub; pin NVIDIA's own wheel and hash instead.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
tensorrt-cu13-libs = { index = "nvidia" }
