name: CI

on:
  push:
    branches: [ "develop", "main", "feat/**", "feats/**", "fix/**", "refactor/**", "test/**" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-bookworm@sha256:bbbf67eadd2381a2738a4a2e36d4c3936c36edd82d80e7ef00411194385d3829
        env:
          POSTGRES_USER: estaciona_test
          POSTGRES_PASSWORD: estaciona_test
          POSTGRES_DB: estaciona_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U estaciona_test -d estaciona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://estaciona_test:estaciona_test@127.0.0.1:5432/estaciona_test
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust Tests
        run: cargo test --locked --all-features

      - name: Build server for delivery integration
        run: cargo build --locked

      - name: Upload integration server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-test-server
          path: server/target/debug/estaciona-ai-rust-server
          if-no-files-found: error
          retention-days: 1

  gateway-ci:
    name: Python Gateway CI
    needs: rust-ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-bookworm@sha256:bbbf67eadd2381a2738a4a2e36d4c3936c36edd82d80e7ef00411194385d3829
        env:
          POSTGRES_USER: estaciona_test
          POSTGRES_PASSWORD: estaciona_test
          POSTGRES_DB: estaciona_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U estaciona_test -d estaciona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://estaciona_test:estaciona_test@127.0.0.1:5432/estaciona_test
      ESTACIONA_REQUIRE_INTEGRATION: "1"
      ESTACIONA_TEST_SERVER: ${{ github.workspace }}/test-server/estaciona-ai-rust-server
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4

      - name: Download integration server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-test-server
          path: test-server

      - name: Make integration server executable
        run: chmod +x "$ESTACIONA_TEST_SERVER"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "gateway/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Check
        run: uv run --locked ruff check

      - name: Run Ruff Format Check
        run: uv run --locked ruff format --check

      - name: Run Pytest
        env:
          ESTACIONA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --locked pytest --junitxml=test-results/gateway.xml

      - name: Upload gateway test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-test-results
          path: gateway/test-results/gateway.xml
          if-no-files-found: warn
          retention-days: 7

  vision-ci:
    name: Python Vision CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vision
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "vision/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Check
        run: uv run ruff check

      - name: Run Ruff Format Check
        run: uv run ruff format --check

      - name: Run Pytest
        run: uv run pytest
