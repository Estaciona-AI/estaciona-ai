name: CI

on:
  push:
    branches: [ "develop", "main", "feat/**", "feats/**", "fix/**", "refactor/**", "test/**" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-bookworm@sha256:bbbf67eadd2381a2738a4a2e36d4c3936c36edd82d80e7ef00411194385d3829
        env:
          POSTGRES_USER: estaciona_test
          POSTGRES_PASSWORD: estaciona_test
          POSTGRES_DB: estaciona_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U estaciona_test -d estaciona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://estaciona_test:estaciona_test@127.0.0.1:5432/estaciona_test
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Rust Tests
        run: cargo test --locked --all-features

      - name: Build server for delivery integration
        run: cargo build --locked

      - name: Upload integration server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-test-server
          path: server/target/debug/estaciona-ai-rust-server
          if-no-files-found: error
          retention-days: 1

  gateway-ci:
    name: Python Gateway CI
    needs: rust-ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-bookworm@sha256:bbbf67eadd2381a2738a4a2e36d4c3936c36edd82d80e7ef00411194385d3829
        env:
          POSTGRES_USER: estaciona_test
          POSTGRES_PASSWORD: estaciona_test
          POSTGRES_DB: estaciona_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U estaciona_test -d estaciona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://estaciona_test:estaciona_test@127.0.0.1:5432/estaciona_test
      ESTACIONA_REQUIRE_INTEGRATION: "1"
      ESTACIONA_TEST_SERVER: ${{ github.workspace }}/test-server/estaciona-ai-rust-server
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download integration server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-test-server
          path: test-server

      - name: Make integration server executable
        run: chmod +x "$ESTACIONA_TEST_SERVER"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "gateway/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Check
        run: uv run --locked ruff check

      - name: Run Ruff Format Check
        run: uv run --locked ruff format --check

      - name: Run Pytest
        env:
          ESTACIONA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run --locked pytest --junitxml=test-results/gateway.xml

      - name: Upload gateway test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-test-results
          path: gateway/test-results/gateway.xml
          if-no-files-found: warn
          retention-days: 7

  vision-ci:
    name: Python Vision CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vision
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install OpenCV system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "vision/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Run Ruff Check
        run: uv run --locked ruff check . ../tools/rtsp-lab

      - name: Run Ruff Format Check
        run: uv run --locked ruff format --check . ../tools/rtsp-lab

      - name: Run Pytest
        run: uv run --locked pytest --ignore=tests/test_rtsp_lab_integration.py

  rtsp-lab-ci:
    name: RTSP lab integration
    needs: vision-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vision
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install OpenCV system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "vision/uv.lock"
      - name: Set up Python
        run: uv python install
      - name: Prepare pinned RTSP lab image
        run: |
          uv run --locked python - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, "../tools/rtsp-lab")
          from services import IMAGE
          subprocess.run(["docker", "info"], check=True, timeout=15, stdout=subprocess.DEVNULL)
          subprocess.run(["docker", "pull", IMAGE], check=True, timeout=120)
          PY
      - name: Test actual RTSP publication, delivery and recovery
        env:
          ESTACIONA_RTSP_TEST: "1"
        run: uv run --locked pytest -q tests/test_rtsp_lab_integration.py

  contracts-ci:
    name: Contract compatibility CI
    needs: rust-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shared
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "shared/uv.lock"
      - name: Download contract exporter
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: delivery-test-server
          path: test-server
      - name: Verify offline export matches published contract bundle
        env:
          DATABASE_URL: invalid-offline-probe
        run: |
          chmod +x ../test-server/estaciona-ai-rust-server
          ../test-server/estaciona-ai-rust-server --export-contracts "$RUNNER_TEMP/generated-contracts"
          diff -u messages.json "$RUNNER_TEMP/generated-contracts/messages.json"
          diff -ru v1 "$RUNNER_TEMP/generated-contracts/v1"
      - name: Check first-party licensing policy
        run: python ../scripts/check_licenses.py
      - name: Lint contract checks
        run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - name: Validate generated schemas and Python producers
        run: uv run --locked pytest --junitxml=test-results/contracts.xml
      - name: Upload versioned contract bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: estaciona-ai-contracts-v1
          path: |
            shared/messages.json
            shared/v1/
          if-no-files-found: error
          retention-days: 14
      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-test-results
          path: shared/test-results/contracts.xml
          if-no-files-found: warn
          retention-days: 7
