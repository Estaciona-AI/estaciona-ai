[advisories]
# Fetch RustSec on every run; fail on yanked and newly reported vulnerable crates.
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    # Reviewed 2026-10-25; review again by 2026-11-24 or before changing JWT algorithms.
    # jsonwebtoken/rust_crypto and openidconnect include RSA. Local sessions use
    # HS256 and the identity provider tokens are accepted only as EdDSA
    # (Ed25519); no RSA key is accepted and no RSA private key exists.
    { id = "RUSTSEC-2023-0071", reason = "RSA timing attack is outside the HS256 and EdDSA-only call paths; upstream has no patched release." },
    # Same review deadline. crypto-bigint 0.5.5 arrives through p256/p384 and
    # elliptic-curve, pulled by jsonwebtoken/rust_crypto and openidconnect. No EC
    # key or ES* algorithm is accepted: identity tokens are EdDSA only. A
    # compatible patched transitive upgrade is unavailable; review this
    # exception before enabling any EC algorithm.
    { id = "RUSTSEC-2026-0387", reason = "Elliptic-curve bigint timing paths are unused: sessions are HS256 and identity tokens EdDSA only." },
]
