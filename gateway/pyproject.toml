[project]
name = "gateway"
version = "0.1.0"
description = "Estaciona AI Gateway"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.50",
    "torch>=2.12.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.16"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["E402", "E741"]
